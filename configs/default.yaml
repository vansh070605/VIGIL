# VIGIL — Default Configuration
# MVTec AD 2 Vial Dataset — Anomaly Detection

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  root: "dataset"                      # Relative to project root; override via env VIGIL_DATA_ROOT
  category: "vial"
  image_format: ".png"
  color_mode: "L"                      # Grayscale (as discovered in inspection)
  resolution: [1400, 1900]             # Width x Height

  splits:
    train: "train/good"
    validation: "validation/good"
    test_good: "test_public/good"
    test_bad: "test_public/bad"
    ground_truth: "test_public/ground_truth/bad"
    test_private: "test_private"
    test_private_mixed: "test_private_mixed"

  # Domain-shift variants present in test data
  variants:
    - regular
    - overexposed
    - underexposed
    - shift_1
    - shift_2
    - shift_3
    - shift_4

# ─── Preprocessing ───────────────────────────────────────────────────────────
preprocessing:
  resize: [256, 256]                   # Target size for model input (can be changed)
  center_crop: null                    # Optional center crop after resize
  normalize:
    mean: [0.485, 0.456, 0.406]        # ImageNet (backbone is pretrained on ImageNet)
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: false                     # Typically disabled for AD
    horizontal_flip: false
    vertical_flip: false

# ─── Model ────────────────────────────────────────────────────────────────────
model:
  name: "patchcore"                    # Recommended baseline
  backbone: "wide_resnet50_2"
  layers_to_extract: ["layer2", "layer3"]
  coreset_sampling_ratio: 0.01         # 1% for CPU feasibility
  num_neighbors: 9
  batch_size: 4

# ─── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  # Image-level metrics
  image_level:
    - auroc
    - f1_score
    - average_precision

  # Pixel-level metrics (anomaly segmentation)
  pixel_level:
    - auroc
    - pro                              # Per-Region Overlap
    - f1_score

  threshold_method: "percentile"       # or "max_f1"

# ─── Experiment ───────────────────────────────────────────────────────────────
experiment:
  seed: 42
  output_dir: "experiments"
  save_anomaly_maps: true
  device: "cpu"                        # No CUDA available in this environment

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  save_to_file: true
  log_dir: "experiments/logs"
